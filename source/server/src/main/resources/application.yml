server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${HTTP_MAX_THREADS:64}
      min-spare: 8
    max-connections: ${HTTP_MAX_CONNECTIONS:512}
    accept-count: ${HTTP_ACCEPT_COUNT:64}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
      minimum-idle: 2
      connection-timeout: 3000
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:grammar_quest}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
app:
  allowed-origin: ${CLIENT_ORIGIN:http://localhost:5173}

  capacity:
    max-sockets: ${MAX_SOCKETS:200}
    max-sockets-per-account: ${MAX_SOCKETS_PER_ACCOUNT:5}
    max-concurrent-requests: ${MAX_CONCURRENT_REQUESTS:32}
